apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Logasundaram-bot/gitlab_devops.git
    targetRevision: main
    path: nodejs-gitops/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: nodejs-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

